
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Organize</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="Head">
        <h1>Hello</h1>
        <h2>This is your task</h2>
    </div>

    <form class="task-input" id="task-form">
        <input
            type="text"
            id="task-name"
            placeholder="Enter your task"
            required
        >

        <input
            type="date"
            id="task-deadline"
        >

        <button type="submit">Add Task</button>
    </form>
</body>
</html>
